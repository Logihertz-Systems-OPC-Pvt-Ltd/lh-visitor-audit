[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-visitor-audit"
version = "0.1.0"
description = "Analyzes HTTP access logs (Combined/JSON/CloudFront/Cloudflare) to detect directory brute-forcing, vulnerability scanner fingerprints (Nuclei/Nikto/SQLMap), credential stuffing bursts, and anomalous L7 scraping velocity."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "access-log-analyzer",
    "bot-detection",
    "web-telemetry",
    "threat-intelligence",
    "scanner-detection",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-visitor-audit"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-visitor-audit"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-visitor-audit#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-visitor-audit/issues"

[project.scripts]
lh-visitor = "lh_visitor_audit.cli:app"
lh-visitor-audit = "lh_visitor_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_visitor_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

